[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "yrt"
version = "0.1.0"
description = "Automated system that tracks YouTube subscriptions and categorizes new uploads into playlists"
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
authors = [
    { name = "Dylan \"Dyl-M\" Monfret", email = "dyl_m.dev@proton.me" }
]
keywords = ["youtube", "playlist", "automation", "tracker", "api"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Multimedia :: Video",
]
dependencies = [
    "google-auth>=2.62.0,<3",
    "google-auth-oauthlib>=1.5.0,<2",
    "isodate>=0.7.2,<1",
    "pandas>=3.0.6,<4",
    "pygithub>=2.10.0,<3",
    "python-dateutil>=2.9.0.post0,<3",
    "python-youtube>=0.9.9,<1",
    "requests>=2.34.2,<3",
    "tqdm>=4.70.1,<5",
    "tzlocal>=5.4.4,<6"
]

[project.optional-dependencies]
dev = [
    "mypy==2.4.0",
    "pandas-stubs==3.0.5.260914",
    "pytest==9.1.1",
    "pytest-cov==7.1.0",
    "ruff==0.17.0",
    "types-requests==2.33.0.20261006",
]
# Future analytics features (currently unused)
analytics = [
    "beautifulsoup4==4.15.0",
    "ipykernel==7.4.0",
    "jupyter==1.1.1",
    "nbformat==5.11.1",
    "numpy==2.5.4",
    "plotly==7.1.0",
    "scikit-learn==1.9.1",
]

[project.urls]
Repository = "https://github.com/Dyl-M/youtube_release_tracker"
Issues = "https://github.com/Dyl-M/youtube_release_tracker/issues"

# Security floors for transitive dependencies
[tool.uv]
constraint-dependencies = [
    "cryptography>=50.0.0",  # CVE-2026-69247 (PKCS#7 Bleichenbacher oracle)
    "oauthlib>=4.0.0",  # CVE-2026-49264, CVE-2026-49265 (JSONP callback, PKCE timing)
    "pyasn1>=0.6.4",  # CVE-2026-59884, CVE-2026-59885, CVE-2026-59886 (decoder denial of service)
    "urllib3>=2.8.0",  # CVE-2026-97687, CVE-2026-97688, CVE-2026-97689 (proxy TLS, chunked streaming)
]

# CLI entry point (requires wrapper function - see main.py)
# [project.scripts]
# yrt = "yrt.main:cli"

[tool.ruff]
target-version = "py312"
line-length = 120
extend-exclude = ["*.ipynb", "*.md"] # ruff >= 0.16 formats Markdown code fences; docs are not code

[tool.ruff.lint]
select = [
    "F", # pyflakes
    "E", # pycodestyle errors
    "W", # pycodestyle warnings
    "I", # isort
    "UP", # pyupgrade
    "B", # flake8-bugbear
    "SIM", # flake8-simplify
    "RUF", # ruff-specific rules
    "D", # pydocstyle
    "N", # pep8-naming
    "ANN", # flake8-annotations
    "S", # flake8-bandit (security)
    "T20", # flake8-print
    "PT", # flake8-pytest-style
    "RET", # flake8-return
    "TCH", # flake8-type-checking
    "PLR", # pylint refactor (catches useless-return and similar)
]
ignore = [
    "D104", # missing docstring in public package (re-export __init__ files)
    "ANN401", # explicit Any is intentional (codebase uses dict[str, Any] for API payloads)
    "RUF022", # __all__ uses intentional comment-grouped ordering, not alphabetical
    "PLR2004", # magic values in comparisons (HTTP status codes, small literals) are clear in context
    "PLR0913", # API-wrapper functions legitimately take many arguments (service, playlist IDs, ...)
    "PLR0917", # same rationale: positional-argument count on the same API-wrapper signatures
]

[tool.ruff.lint.per-file-ignores]
"_tests/**" = ["ANN", "S101"] # tests: no annotations required, assert is expected
"_scripts/**" = ["T20"] # maintenance scripts print progress to the console

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.isort]
known-first-party = ["yrt"]

[tool.ruff.format]
quote-style = "single" # preserve the codebase's single-quote convention

[tool.mypy]
python_version = "3.12"
warn_return_any = true
warn_unused_configs = true
warn_no_return = true
warn_unreachable = true
strict_optional = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
show_error_codes = true

[[tool.mypy.overrides]]
module = ["isodate.*", "pyyoutube.*", "tqdm.*", "google_auth_oauthlib.*", "tzlocal.*"]
ignore_missing_imports = true